server:
  port: 8801

spring:
  application:
    name: blog
  # 默认激活的开发环境
  profiles:
    active: dev

  # Spring AI 配置
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY:sk-盗api-key的去死吧}
      base-url: https://api.siliconflow.cn/v1
      chat:
        completions-path: /chat/completions
        options:
          model: Qwen/Qwen3-8B #模型随时可能过期
          temperature: 0.3

# JWT 默认配置（可被环境配置覆盖）
jwt:
  secret: djblog-jwt-secret-key-must-be-at-least-64-characters-long-for-hs512-algorithm-security
  expiration: 604800

# MyBatis Plus 通用配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Springdoc OpenAPI 通用配置
springdoc:
  packages-to-scan: site.dengwei.blog.controller
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 平台发布凭据（从环境变量读取，避免明文存储）
platform:
  juejin:
    api-url: https://api.juejin.cn/content_api/v1/article/publish
    access-token: ${PLATFORM_JUEJIN_ACCESS_TOKEN:}
  csdn:
    api-url: https://api.csdn.net/
    access-token: ${PLATFORM_CSDN_ACCESS_TOKEN:}
  cnblog:
    api-url: https://i.cnblogs.com/openapi/v1/posts
    personal-token: ${PLATFORM_CNBLOG_PERSONAL_TOKEN:}
  segmentfault:
    api-url: https://api.segmentfault.com/
    access-token: ${PLATFORM_SEGMENTFAULT_ACCESS_TOKEN:}

# 博客评论审核配置（全局）
blog:
  site-domain: ${BLOG_SITE_DOMAIN:https://blog.dengwei.site}
  comment:
    # 是否启用评论审核（true: 需要审核，false: 默认通过）
    audit-enabled: false
    # 是否启用 AI 智能判断
    ai-enabled: false
    # AI 判断模式（AUTO: 自动决定，MANUAL: 辅助判断）
    ai-mode: MANUAL
