    <title>首页</title>
    <!-- 立即应用主题，避免闪烁 -->
    <script>
      (function() {
        const themeMode = localStorage.getItem('themeMode') || 'system';
        let isDark = false;
        
        if (themeMode === 'dark') {
          isDark = true;
        } else if (themeMode === 'system') {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
