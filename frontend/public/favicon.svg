<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141b2d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#409eff"/>
      <stop offset="100%" stop-color="#2d7de6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79bbff"/>
      <stop offset="100%" stop-color="#409eff"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g stroke="#409eff" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
  </g>
  <g fill="#409eff" fill-opacity="0.3">
    <circle cx="8" cy="8" r="1.5"/>
    <circle cx="56" cy="8" r="1.5"/>
    <circle cx="8" cy="56" r="1.5"/>
    <circle cx="56" cy="56" r="1.5"/>
  </g>
  <g stroke="#409eff" stroke-opacity="0.15" stroke-width="0.8" fill="none">
    <polyline points="8,8 8,16 16,16"/>
    <polyline points="56,8 56,16 48,16"/>
    <polyline points="8,56 8,48 16,48"/>
    <polyline points="56,56 56,48 48,48"/>
  </g>
  <text x="32" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#409eff" filter="url(#blur2)" opacity="0.5">DW</text>
  <text x="32" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="url(#glow)" filter="url(#blur1)">DW</text>
  <line x1="14" y1="43" x2="50" y2="43" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="14" cy="43" r="1.2" fill="#79bbff" opacity="0.7"/>
  <circle cx="50" cy="43" r="1.2" fill="#79bbff" opacity="0.7"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#409eff" stroke-opacity="0.12" stroke-width="1"/>
</svg>